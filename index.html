<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading list</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Reading list</h1>
<p class="sub">Track the books you want to read, are reading, or have finished.</p>

<p class="empty" id="empty" hidden>No books yet. Add your first book.</p>

<form id="form">
  <input id="title" type="text" placeholder="Book title" aria-label="Book title" required maxlength="150">
  <select id="status" aria-label="Status">
    <option value="to">To read</option>
    <option value="reading">Reading</option>
    <option value="done">Done</option>
  </select>
  <button class="add" type="submit">Add book</button>
</form>

<div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
<div class="list" id="list"></div>
</main>

<script src="script.js"></script>
</body>
</html>
